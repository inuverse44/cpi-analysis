[project]
name = "cpi-analysis"
version = "0.1.0"
description = "消費者物価指数（総務省統計局）の集計・可視化サンプル"
authors = [
    { name = "Inuverse" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[project.scripts]
cpi-analysis = "cpi_analysis:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# レポートの文章のテンプレートは、日本語の文を途中で折らない
"src/cpi_analysis/report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
